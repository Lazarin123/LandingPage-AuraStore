    <!-- Babel Standalone for JSX compilation -->

    <!-- Lucide Icons CDN -->

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Animations */
      .animate-fadeIn {
        animation: fadeIn 0.25s ease-in-out forwards;
      }
      .animate-slideLeft {
        animation: slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideLeft {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
    </style>
  </head>

    <script type="text/babel">

        useCallback,
        createContext,

      // --- MOCK PRODUCTS DATA (Fallback & Enriched Data) ---

        {

          price: 420.0,

          image:

        {

        },
        {
          id: 7,

          price: 189.9,
          category: "men's clothing",
          rating: { rate: 4.6, count: 98 },
          image:
            "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=800&q=80",
          description:
            "Tecido respirável e ultra-leve com tecnologia repelente à água e capuz ajustável oculto.",
        },
        {
          id: 8,
          title: "Garrafa Térmica Inox 1L KeepCold",
          price: 65.0,
          category: "jewelery",
          rating: { rate: 4.8, count: 320 },
          image:
            "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=800&q=80",
          description:
            "Parede dupla com isolamento a vácuo, conserva bebidas geladas por até 24 horas e quentes por 12 horas.",
        },
      ];

      // --- CONTEXT CREATION ---
      const CartContext = createContext();

      const CartProvider = ({ children }) => {
        const [cart, setCart] = useState(() => {
          const savedCart = localStorage.getItem("aura_cart");
          return savedCart ? JSON.parse(savedCart) : [];
        });
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [freight, setFreight] = useState({
          cep: "",
          cost: null,
          days: null,
          loading: false,
        });

        useEffect(() => {
          localStorage.setItem("aura_cart", JSON.stringify(cart));
        }, [cart]);

        const addToCart = (product, quantity = 1) => {
          setCart((prev) => {
            const existing = prev.find((item) => item.id === product.id);
            if (existing) {
              return prev.map((item) =>
                item.id === product.id
                  ? { ...item, quantity: item.quantity + quantity }
                  : item,
              );
            }
            return [...prev, { ...product, quantity }];
          });
          setIsCartOpen(true);
        };

        const removeFromCart = (productId) => {
          setCart((prev) => prev.filter((item) => item.id !== productId));
        };

        const updateQuantity = (productId, newQuantity) => {
          if (newQuantity <= 0) {
            removeFromCart(productId);
            return;
          }
          setCart((prev) =>
            prev.map((item) =>
              item.id === productId ? { ...item, quantity: newQuantity } : item,
            ),
          );
        };

        const clearCart = () => {
          setCart([]);
          setFreight({ cep: "", cost: null, days: null, loading: false });
        };

        const subtotal = useMemo(() => {
          return cart.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0,
          );
        }, [cart]);

        const totalItems = useMemo(() => {
          return cart.reduce((sum, item) => sum + item.quantity, 0);
        }, [cart]);

        const calculateFreight = async (cep) => {
          const cleanCep = cep.replace(/\D/g, "");
          if (cleanCep.length !== 8) return false;

          setFreight((prev) => ({ ...prev, loading: true, cep: cleanCep }));

          try {
            // Consult ViaCEP for address verification
            const response = await fetch(
              `https://viacep.com.br/ws/${cleanCep}/json/`,
            );
            const data = await response.json();

            if (data.erro) {
              setFreight({
                cep: "",
                cost: null,
                days: null,
                loading: false,
                error: "CEP não encontrado",
              });
              return false;
            }

            // Mock Freight Calculation based on CEP state
            const mockCost =
              cleanCep.startsWith("0") || cleanCep.startsWith("1")
                ? 15.0
                : 28.5;
            const mockDays =
              cleanCep.startsWith("0") || cleanCep.startsWith("1") ? 2 : 5;

            setFreight({
              cep: cleanCep,
              cost: subtotal > 250 ? 0 : mockCost, // Free shipping above R$250
              days: mockDays,
              address: `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`,
              loading: false,
              error: null,
            });
            return true;
          } catch (err) {
            setFreight({
              cep: "",
              cost: null,
              days: null,
              loading: false,
              error: "Erro ao calcular frete",
            });
            return false;
          }
        };

        return (
          <CartContext.Provider
            value={{
              cart,
              addToCart,
              removeFromCart,
              updateQuantity,
              clearCart,
              isCartOpen,
              setIsCartOpen,
              subtotal,
              totalItems,
              freight,
              calculateFreight,
            }}
          >
            {children}
          </CartContext.Provider>
        );
      };

      const useCart = () => useContext(CartContext);

      // --- ICON COMPONENT HELPER ---
      const Icon = ({ name, size = 20, className = "" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [name]);

        return (
          <i
            data-lucide={name}
            style={{ width: size, height: size }}
            className={`inline-block ${className}`}
          ></i>
        );
      };

      // --- HEADER COMPONENT ---
      const Header = ({
        currentView,
        setCurrentView,
        searchTerm,
        setSearchTerm,
      }) => {
        const { totalItems, setIsCartOpen } = useCart();

        return (
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 gap-4">
                {/* Logo */}
                <div
                  className="flex items-center gap-2 cursor-pointer select-none"
                  onClick={() => setCurrentView({ type: "catalog" })}
                >
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-200">
                    A
                  </div>
                  <div>
                    <span className="text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                      AURA
                    </span>
                    <span className="text-xs font-semibold tracking-widest text-slate-400 block -mt-1 uppercase">
                      Store
                    </span>
                  </div>
                </div>

                {/* Instant Search Bar */}
                <div className="flex-1 max-w-md hidden sm:block relative">
                  <div className="relative flex items-center">
                    <span className="absolute left-3 text-slate-400">
                      <Icon name="search" size={18} />
                    </span>
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Buscar produtos, categorias..."
                      className="w-full pl-10 pr-8 py-2 bg-slate-100 hover:bg-slate-100/80 focus:bg-white text-sm rounded-full border border-transparent focus:border-indigo-500 focus:outline-none transition-all duration-200"
                    />
                    {searchTerm && (
                      <button
                        onClick={() => setSearchTerm("")}
                        className="absolute right-3 text-slate-400 hover:text-slate-600"
                      >
                        <Icon name="x" size={16} />
                      </button>
                    )}
                  </div>
                </div>

                {/* Actions / Cart Button */}
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setCurrentView({ type: "catalog" })}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${currentView.type === "catalog" ? "text-indigo-600 bg-indigo-50" : "text-slate-600 hover:text-indigo-600"}`}
                  >
                    Catálogo
                  </button>

                  <button
                    onClick={() => setIsCartOpen(true)}
                    className="relative p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 transition-colors flex items-center justify-center"
                    aria-label="Abrir carrinho"
                  >
                    <Icon name="shopping-bag" size={20} />
                    {totalItems > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white animate-fadeIn">
                        {totalItems}
                      </span>
                    )}
                  </button>
                </div>
              </div>

              {/* Mobile Search Bar */}
              <div className="pb-3 sm:hidden">
                <div className="relative flex items-center">
                  <span className="absolute left-3 text-slate-400">
                    <Icon name="search" size={18} />
                  </span>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Buscar produtos..."
                    className="w-full pl-10 pr-8 py-2 bg-slate-100 text-sm rounded-full border border-transparent focus:border-indigo-500 focus:outline-none"
                  />
                  {searchTerm && (
                    <button
                      onClick={() => setSearchTerm("")}
                      className="absolute right-3 text-slate-400"
                    >
                      <Icon name="x" size={16} />
                    </button>
                  )}
                </div>
              </div>
            </div>
          </header>
        );
      };

      // --- PRODUCT CARD COMPONENT ---
      const ProductCard = ({ product, onViewDetail }) => {
        const { addToCart } = useCart();

        return (
          <div className="group bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col overflow-hidden">
            {/* Image Container */}
            <div
              className="relative pt-[80%] bg-slate-50 overflow-hidden cursor-pointer"
              onClick={() => onViewDetail(product)}
            >
              <img
                src={product.image}
                alt={product.title}
                className="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
                loading="lazy"
              />
              <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase text-slate-700 shadow-sm border border-white/50">
                {product.category}
              </span>
            </div>

            {/* Content */}
            <div className="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-1 mb-2">
                  <span className="text-amber-400 flex items-center">
                    <Icon name="star" size={14} className="fill-amber-400" />
                  </span>
                  <span className="text-xs font-semibold text-slate-700">
                    {product.rating.rate}
                  </span>
                  <span className="text-xs text-slate-400">
                    ({product.rating.count})

                <h3
                  className="font-semibold text-slate-800 text-base line-clamp-2 hover:text-indigo-600 transition-colors cursor-pointer mb-2"
                  onClick={() => onViewDetail(product)}

                <p className="text-xs text-slate-500 line-clamp-2 mb-4">

              <div className="pt-3 border-t border-slate-100 flex items-center justify-between mt-auto">
                <div>
                  <span className="text-xs text-slate-400 block font-medium">
                    Preço
                  </span>
                  <span className="text-lg font-bold text-slate-900">
                    R${" "}
                    {product.price.toLocaleString("pt-BR", {
                      minimumFractionDigits: 2,

                  </span>
                </div>

                <button
                  onClick={() => addToCart(product)}
                  className="bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-1.5 active:scale-95"

                  Comprar
                </button>
              </div>
            </div>

        );
      };

      // --- CART DRAWER COMPONENT ---
      const CartDrawer = ({ onNavigateCheckout }) => {
        const {
          cart,
          isCartOpen,
          setIsCartOpen,
          removeFromCart,
          updateQuantity,
          subtotal,
          freight,
          calculateFreight,
        } = useCart();
        const [cepInput, setCepInput] = useState("");

        if (!isCartOpen) return null;

        const handleFreightSubmit = (e) => {
          e.preventDefault();
          calculateFreight(cepInput);
        };

        const total = subtotal + (freight.cost || 0);

        return (
          <div className="fixed inset-0 z-50 overflow-hidden animate-fadeIn">
            {/* Backdrop */}
            <div
              className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity"
              onClick={() => setIsCartOpen(false)}
            />

            <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
              <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col animate-slideLeft">
                {/* Drawer Header */}
                <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon
                      name="shopping-bag"
                      size={20}
                      className="text-indigo-600"
                    />
                    <h2 className="text-lg font-bold text-slate-800">
                      Seu Carrinho
                    </h2>
                  </div>
                  <button
                    onClick={() => setIsCartOpen(false)}
                    className="p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>

                {/* Items List */}
                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-12">
                      <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                        <Icon name="shopping-cart" size={32} />
                      </div>
                      <p className="text-slate-600 font-semibold mb-1">
                        Carrinho Vazio
                      </p>
                      <p className="text-xs text-slate-400 mb-6">
                        Explore o catálogo e adicione seus produtos favoritos.
                      </p>
                      <button
                        onClick={() => setIsCartOpen(false)}
                        className="px-5 py-2.5 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-md shadow-indigo-100 hover:bg-indigo-700 transition-colors"
                      >
                        Voltar às Compras
                      </button>
                    </div>
                  ) : (
                    cart.map((item) => (
                      <div
                        key={item.id}
                        className="flex gap-4 p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition-colors"
                      >
                        <img
                          src={item.image}
                          alt={item.title}
                          className="w-20 h-20 object-cover rounded-lg bg-white border border-slate-100"
                        />
                        <div className="flex-1 flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between items-start gap-2">
                              <h4 className="text-xs font-bold text-slate-800 line-clamp-1">
                                {item.title}
                              </h4>
                              <button
                                onClick={() => removeFromCart(item.id)}
                                className="text-slate-400 hover:text-rose-500"
                              >
                                <Icon name="trash-2" size={14} />
                              </button>
                            </div>
                            <span className="text-xs text-slate-500">
                              R$ {item.price.toFixed(2)}
                            </span>
                          </div>

                          <div className="flex items-center justify-between mt-2">
                            <div className="flex items-center border border-slate-200 rounded-lg bg-white">
                              <button
                                onClick={() =>
                                  updateQuantity(item.id, item.quantity - 1)
                                }
                                className="px-2 py-0.5 text-slate-600 hover:bg-slate-100 rounded-l-lg"
                              >
                                -
                              </button>
                              <span className="px-3 text-xs font-semibold">
                                {item.quantity}
                              </span>
                              <button
                                onClick={() =>
                                  updateQuantity(item.id, item.quantity + 1)
                                }
                                className="px-2 py-0.5 text-slate-600 hover:bg-slate-100 rounded-r-lg"
                              >
                                +
                              </button>
                            </div>
                            <span className="text-xs font-bold text-slate-900">
                              R$ {(item.price * item.quantity).toFixed(2)}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Freight Calculator & Summary */}
                {cart.length > 0 && (
                  <div className="p-5 border-t border-slate-100 bg-slate-50/50 space-y-4">
                    {/* Freight Estimator */}
                    <form onSubmit={handleFreightSubmit} className="space-y-2">
                      <label className="text-xs font-semibold text-slate-700 block">
                        Calcular Frete (ViaCEP)
                      </label>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="00000-000"
                          maxLength="9"
                          value={cepInput}
                          onChange={(e) => setCepInput(e.target.value)}
                          className="flex-1 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500"
                        />
                        <button
                          type="submit"
                          disabled={freight.loading}
                          className="px-4 py-1.5 bg-slate-800 text-white text-xs font-medium rounded-lg hover:bg-slate-900 transition-colors disabled:opacity-50"
                        >
                          {freight.loading ? "Calculando..." : "Calcular"}
                        </button>
                      </div>
                      {freight.error && (
                        <p className="text-[11px] text-rose-500">
                          {freight.error}
                        </p>
                      )}
                      {freight.cost !== null && (
                        <div className="p-2.5 bg-indigo-50/50 rounded-lg border border-indigo-100 text-xs text-indigo-900 flex justify-between items-center">
                          <div>
                            <span className="font-semibold block">
                              {freight.cost === 0
                                ? "Frete Grátis!"
                                : `R$ ${freight.cost.toFixed(2)}`}
                            </span>
                            <span className="text-[10px] text-indigo-600">
                              Entrega em até {freight.days} dias úteis
                            </span>
                          </div>
                          <Icon
                            name="truck"
                            size={18}
                            className="text-indigo-600"
                          />
                        </div>
                      )}
                    </form>

                    {/* Price Calculation Breakdown */}

        const [minRating, setMinRating] = useState(0);
        const [priceRange, setPriceRange] = useState(2000);
        const [currentPage, setCurrentPage] = useState(1);
        const itemsPerPage = 6;

        // Filter Logic
        const filteredProducts = useMemo(() => {
          return products
            .filter((product) => {
              const matchesSearch =
                product.title
                  .toLowerCase()
                  .includes(searchTerm.toLowerCase()) ||
                product.description
                  .toLowerCase()
                  .includes(searchTerm.toLowerCase());
              const matchesCategory =
                selectedCategory === "all" ||
                product.category === selectedCategory;
              const matchesRating = product.rating.rate >= minRating;
              const matchesPrice = product.price <= priceRange;

              return (
                matchesSearch &&
                matchesCategory &&
                matchesRating &&
                matchesPrice
              );
            })
            .sort((a, b) => {
              if (sortBy === "price-low") return a.price - b.price;
              if (sortBy === "price-high") return b.price - a.price;
              if (sortBy === "rating") return b.rating.rate - a.rating.rate;
              return a.id - b.id; // Default / Featured
            });
        }, [
          products,
          searchTerm,
          selectedCategory,
          sortBy,
          minRating,
          priceRange,
        ]);

        // Pagination Calculation
        const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
        const currentProducts = useMemo(() => {
          const start = (currentPage - 1) * itemsPerPage;
          return filteredProducts.slice(start, start + itemsPerPage);
        }, [filteredProducts, currentPage]);

        useEffect(() => {
          setCurrentPage(1); // Reset page on filter change

                </div>

                {/* Products List */}
                {loading ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {[1, 2, 3, 4, 5, 6].map((n) => (
                      <div
                        key={n}
                        className="bg-white rounded-2xl h-80 animate-pulse p-4 flex flex-col justify-between"
                      >
                        <div className="bg-slate-200 h-40 rounded-xl w-full" />
                        <div className="space-y-2">
                          <div className="bg-slate-200 h-4 rounded w-3/4" />
                          <div className="bg-slate-200 h-4 rounded w-1/2" />
                        </div>
                        <div className="bg-slate-200 h-8 rounded-xl w-full" />
                      </div>
                    ))}
                  </div>
                ) : currentProducts.length === 0 ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-100 shadow-sm">
                    <Icon
                      name="search-x"
                      size={48}
                      className="mx-auto text-slate-300 mb-3"
                    />
                    <h3 className="text-base font-bold text-slate-800 mb-1">
                      Nenhum produto encontrado
                    </h3>
                    <p className="text-xs text-slate-400">
                      Tente ajustar seus filtros ou termo de busca.
                    </p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {currentProducts.map((product) => (
                      <ProductCard
                        key={product.id}
                        product={product}
                        onViewDetail={onViewDetail}
                      />
                    ))}
                  </div>
                )}

                {/* Pagination Controls */}
                {totalPages > 1 && (
                  <div className="flex justify-center items-center gap-2 mt-10">
                    <button
                      disabled={currentPage === 1}
                      onClick={() => setCurrentPage((p) => p - 1)}
                      className="p-2 border rounded-xl bg-white text-slate-600 disabled:opacity-40 hover:bg-slate-50"
                    >
                      <Icon name="chevron-left" size={18} />
                    </button>

                    {Array.from({ length: totalPages }, (_, i) => i + 1).map(
                      (page) => (
                        <button
                          key={page}
                          onClick={() => setCurrentPage(page)}
                          className={`w-9 h-9 text-xs font-bold rounded-xl transition-all ${currentPage === page ? "bg-indigo-600 text-white shadow-md shadow-indigo-100" : "bg-white border text-slate-600 hover:bg-slate-50"}`}
                        >
                          {page}
                        </button>
                      ),
                    )}

                    <button
                      disabled={currentPage === totalPages}
                      onClick={() => setCurrentPage((p) => p + 1)}
                      className="p-2 border rounded-xl bg-white text-slate-600 disabled:opacity-40 hover:bg-slate-50"
                    >
                      <Icon name="chevron-right" size={18} />
                    </button>
                  </div>
                )}
              </div>
            </div>
          </main>
        );
      };

      // --- SUCCESS SCREEN MODAL ---
      const SuccessModal = ({ onClose }) => (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl space-y-4">
            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
              <Icon name="check-circle-2" size={36} />
            </div>
            <h3 className="text-xl font-bold text-slate-800">
              Pedido Confirmado!
            </h3>
            <p className="text-xs text-slate-500 leading-relaxed">
              Seu pedido foi processado com sucesso. Enviamos um e-mail de
              confirmação com o código de rastreamento.
            </p>
            <button
              onClick={onClose}
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-100 transition-colors"
            >
              Continuar Comprando
            </button>
          </div>
        </div>
      );

      // --- MAIN APP COMPONENT ---
      const App = () => {
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [loading, setLoading] = useState(false);
        const [searchTerm, setSearchTerm] = useState("");
        const [currentView, setCurrentView] = useState({ type: "catalog" });
        const [showSuccess, setShowSuccess] = useState(false);

        // Fetch external products from FakeStoreAPI (Fallback to initial state if fails)
        useEffect(() => {
          const fetchExternalProducts = async () => {
            try {
              setLoading(true);
              const res = await fetch(
                "https://fakestoreapi.com/products?limit=8",
              );
              if (res.ok) {
                const apiData = await res.json();
                if (apiData.length > 0) {
                  // Enrich API data with pt-BR formatting where needed
                  const formatted = apiData.map((item) => ({
                    ...item,
                    price: Math.round(item.price * 5), // Simple currency conversion mock
                  }));
                  setProducts(formatted);
                }
              }
            } catch (e) {
              console.warn(
                "API Fetching failed. Using local mock data instead.",
                e,
              );
            } finally {
              setLoading(false);
            }
          };

          fetchExternalProducts();
        }, []);

        return (
          <CartProvider>
            <div className="min-h-screen flex flex-col">
              <Header
                currentView={currentView}
                setCurrentView={setCurrentView}
                searchTerm={searchTerm}
                setSearchTerm={setSearchTerm}
              />

              <div className="flex-1">
                {currentView.type === "catalog" && (
                  <CatalogView
                    products={products}
                    loading={loading}
                    searchTerm={searchTerm}
                    onViewDetail={(product) =>
                      setCurrentView({ type: "detail", product })
                    }
                  />
                )}

                {currentView.type === "detail" && (
                  <ProductDetailView
                    product={currentView.product}
                    onBack={() => setCurrentView({ type: "catalog" })}
                  />
                )}

                {currentView.type === "checkout" && (
                  <CheckoutView
                    onCompleteOrder={() => {
                      setShowSuccess(true);
                      setCurrentView({ type: "catalog" });
                    }}
                  />
                )}
              </div>

              <CartDrawer
                onNavigateCheckout={() => setCurrentView({ type: "checkout" })}
              />

              {showSuccess && (
                <SuccessModal onClose={() => setShowSuccess(false)} />
              )}

              {/* Footer */}
              <footer className="bg-white border-t border-slate-200 mt-16 py-8">
                <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400 space-y-2">
                  <p>
                    © 2026 Aura Store. Projeto Frontend de Portfólio de Alta
                    Performance.
                  </p>
                  <p>
                    Desenvolvido com React, Tailwind CSS e integração de APIs
                    REST.
                  </p>
                </div>
              </footer>
            </div>
          </CartProvider>
        );
      };

      // Render React Root
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
